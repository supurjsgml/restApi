name: 배포 가쥬아

on:
  workflow_dispatch:

jobs:
  # 소스 코드 변경 사항 확인
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed-files.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=completed&conclusion=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha')
          
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "null" ]; then
            echo ">> 이전 성공 빌드 이력이 없어 직전 커밋(HEAD^)과 비교합니다."
            PREV_SHA="HEAD^"
          else
            echo ">> 이전 성공 배포 커밋: $PREV_SHA"
          fi
          
          if git diff --quiet $PREV_SHA HEAD -- \
            src/main build.gradle Dockerfile .github/workflows/deploy.yml; then
            echo ">> 소스 코드 변동 없음 -> 단순 재시작"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo ">> 소스 코드 변동 감지 -> 신규 빌드 및 배포 진행"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # 소스 코드 변경이 있을 때: 빌드 및 신규 배포
  build-and-deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: redoc
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:latest"
          
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:latest"

          if ! az containerapp show --name rest-api --resource-group guney-aks &>/dev/null; then
            echo ">> 신규 Azure Container App 생성 및 배포: rest-api"
            az containerapp create \
              --name rest-api \
              --resource-group guney-aks \
              --environment cluster-rest-api \
              --image "$IMAGE_TAG" \
              --target-port 8080 \
              --ingress external \
              --registry-server ghcr.io \
              --registry-username ${{ github.actor }} \
              --registry-password ${{ secrets.GITHUB_TOKEN }} \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --env-vars \
                SPRING_PROFILES_ACTIVE=prod \
                REDIS_HOST="${{ secrets.REDIS_HOST }}" \
                REDIS_PORT="${{ secrets.REDIS_PORT }}" \
                REDIS_TOKEN="${{ secrets.REDIS_TOKEN }}" \
                KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
                KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
                KAKAO_REFRESH_TOKEN="${{ secrets.KAKAO_REFRESH_TOKEN }}" \
                GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
                APP_ADMIN_EMAILS="${{ secrets.APP_ADMIN_EMAILS }}" \
                GRAFANA_TOKEN="${{ secrets.GRAFANA_TOKEN }}"
          else
            echo ">> 기존 Azure Container App 업데이트 배포: rest-api"
            az containerapp registry set \
              --name rest-api \
              --resource-group guney-aks \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GITHUB_TOKEN }}

            az containerapp update \
              --name rest-api \
              --resource-group guney-aks \
              --image "$IMAGE_TAG" \
              --set-env-vars \
                SPRING_PROFILES_ACTIVE=prod \
                REDIS_HOST="${{ secrets.REDIS_HOST }}" \
                REDIS_PORT="${{ secrets.REDIS_PORT }}" \
                REDIS_TOKEN="${{ secrets.REDIS_TOKEN }}" \
                KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
                KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
                KAKAO_REFRESH_TOKEN="${{ secrets.KAKAO_REFRESH_TOKEN }}" \
                GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
                APP_ADMIN_EMAILS="${{ secrets.APP_ADMIN_EMAILS }}" \
                GRAFANA_TOKEN="${{ secrets.GRAFANA_TOKEN }}"
          fi

  # 소스 코드 변경이 없을 때: 빌드 건너뛰고 환경변수 갱신 및 즉시 재시작
  restart:
    needs: check
    if: needs.check.outputs.changed == 'false'
    runs-on: ubuntu-latest
    environment: redoc
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Azure Container App
        run: |
          echo ">> 소스 코드 변경 없음: 최신 환경변수 적용 및 컨테이너 무중단 재시작 실행"
          az containerapp update \
            --name rest-api \
            --resource-group guney-aks \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=prod \
              REDIS_HOST="${{ secrets.REDIS_HOST }}" \
              REDIS_PORT="${{ secrets.REDIS_PORT }}" \
              REDIS_TOKEN="${{ secrets.REDIS_TOKEN }}" \
              KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              KAKAO_REFRESH_TOKEN="${{ secrets.KAKAO_REFRESH_TOKEN }}" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              APP_ADMIN_EMAILS="${{ secrets.APP_ADMIN_EMAILS }}" \
              GRAFANA_TOKEN="${{ secrets.GRAFANA_TOKEN }}"
